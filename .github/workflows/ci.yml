name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      # The API dependencies (no PyTorch), plus onnx to build the stand-in classifier of the tests.
      - name: Install dependencies
        run: pip install -r api/requirements.txt onnx==1.23.2 pytest==9.1.1 httpx==0.28.1 ruff==0.16.10

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      # Models are not in git, so this image has none: it checks that the build works and that the
      # API starts, not the predictions (the tests cover those).
      - name: Build the API image
        run: docker build -f api/Dockerfile -t sentinel-agri-api .

      - name: Start it and call /health
        run: |
          docker run -d --name api -p 8000:8000 sentinel-agri-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
