[project]
name = "sentinel-agri"
version = "0.1.0"
description = "Land-cover classification and NDVI gap-filling with Sentinel-1 and Sentinel-2"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
